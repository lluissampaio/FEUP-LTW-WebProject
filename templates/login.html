<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iron Haven — Sign In</title>
  <meta name="description" content="Sign in to your Iron Haven member account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

  <!-- HEADER -->
  <header class="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo">IRON HAVEN</a>
      <input type="checkbox" id="nav-toggle-state" class="nav__state" aria-hidden="true">
      <label for="nav-toggle-state" class="nav__toggle" aria-label="Toggle navigation menu">&#9776;</label>
      <nav class="nav__links" id="primary-nav" aria-label="Primary navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="classes.html">Classes</a></li>
          <li><a href="trainers.html">Trainers</a></li>
          <li><a href="index.html#pricing">Membership</a></li>
          <li><a href="index.html#contact">Contact</a></li>
          <li><a href="register.html" class="btn btn--nav">Join</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- LOGIN -->
  <main>
    <section class="auth" aria-labelledby="login-heading">
      <div class="auth__card">

        <h1 class="auth__title" id="login-heading">Welcome Back</h1>
        <p class="auth__subtitle">Sign in to continue your journey</p>

        <form class="auth__form" id="login-form" action="#" method="post">

          <div class="auth__field">
            <label for="login-email" class="auth__label">Email</label>
            <input type="email" id="login-email" name="email" class="auth__input"
              placeholder="your@email.com" required autocomplete="email">
          </div>

          <div class="auth__field">
            <label for="login-password" class="auth__label">Password</label>
            <input type="password" id="login-password" name="password" class="auth__input"
              placeholder="Your password" required autocomplete="current-password">
          </div>

          <div class="auth__options">
            <label class="auth__remember">
              <input type="checkbox" id="login-remember" name="remember">
              <span>Remember me</span>
            </label>
            <a href="#" class="auth__forgot">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn--primary btn--block">Sign In</button>

        </form>

        <div class="auth__divider">
          <span>or</span>
        </div>

        <p class="auth__alt">
          Don't have an account? <a href="register.html" class="auth__alt-link">Create one</a>
        </p>

      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer" id="contact">
    <div class="site-footer__inner">
      <span class="site-footer__logo">IRON HAVEN</span>
      <p class="site-footer__copy">© 2026 Iron Haven — Private Members Only</p>
      <nav class="site-footer__nav" aria-label="Footer navigation">
        <a href="index.html">Home</a>
        <a href="index.html#services">Facilities</a>
        <a href="index.html#pricing">Membership</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </div>
  </footer>

</body>
</html>
