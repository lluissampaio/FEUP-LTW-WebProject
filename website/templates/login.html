<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iron Haven — Sign In</title>
  <meta name="description" content="Sign in to your Iron Haven member account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

  <!-- HEADER -->
  <header class="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo">IRON HAVEN</a>
      <nav class="nav__links" aria-label="Primary navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="classes.html">Classes</a></li>
          <li><a href="trainers.html">Trainers</a></li>
          <li><a href="index.html#pricing">Membership</a></li>
          <li><a href="index.html#contact">Contact</a></li>
          <li><a href="register.html" class="btn btn--nav">JOIN</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- LOGIN -->
  <main>
    <section class="login" aria-labelledby="login-heading">
      <div class="login__card">

        <h1 class="login__title" id="login-heading">Welcome Back</h1>
        <p class="login__subtitle">Sign in to continue your journey</p>

        <form class="login__form" id="login-form" action="#" method="post">

          <div class="login__field">
            <label for="login-email" class="login__label">Email</label>
            <input type="email" id="login-email" name="email" class="login__input"
              placeholder="your@email.com" required autocomplete="email">
          </div>

          <div class="login__field">
            <label for="login-password" class="login__label">Password</label>
            <input type="password" id="login-password" name="password" class="login__input"
              placeholder="••••••••" required autocomplete="current-password">
          </div>

          <div class="login__options">
            <label class="login__remember">
              <input type="checkbox" id="login-remember" name="remember">
              <span>Remember me</span>
            </label>
            <a href="#" class="login__forgot">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary btn--block">Sign In</button>

        </form>

        <div class="login__divider">
          <span>or</span>
        </div>

        <p class="login__register">
          Don't have an account? <a href="register.html" class="login__register-link">Create one</a>
        </p>

      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer" id="contact" role="contentinfo">
    <div class="footer-inner">
      <span class="footer-logo">IRON HAVEN</span>
      <p class="footer-copy">© 2024 Iron Haven — Private Members Only</p>
      <nav class="footer-nav" aria-label="Footer navigation">
        <a href="index.html">Home</a>
        <a href="index.html#services">Facilities</a>
        <a href="index.html#pricing">Membership</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </div>
  </footer>

</body>
</html>
